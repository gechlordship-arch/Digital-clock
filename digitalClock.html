<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock ⏰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            transition: background 0.5s ease;
            padding: 1rem;
            position: relative;
        }

        body.light {
            background: linear-gradient(135deg, #e0e7ff 0%, #f0f9ff 100%);
        }

        .clock-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 3rem 4rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
            position: relative;
            z-index: 1;
        }

        body.light .clock-container {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.25),
                        0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        .greeting {
            font-size: 1.1rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        body.light .greeting {
            color: #64748b;
        }

        .time {
            font-size: 5.5rem;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.3rem;
        }

        body.light .time {
            color: #0f172a;
        }

        .seconds {
            font-size: 3rem;
            color: #3b82f6;
        }

        .ampm {
            font-size: 1.5rem;
            font-weight: 600;
            color: #3b82f6;
            margin-left: 0.5rem;
            letter-spacing: 0.1em;
        }

        .date {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-top: 1rem;
            font-weight: 500;
        }

        body.light .date {
            color: #475569;
        }

        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f1f5f9;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            background: rgba(255, 255, 255, 0.2);
        }

        body.light .theme-toggle {
            background: rgba(15, 23, 42, 0.1);
            border-color: rgba(15, 23, 42, 0.2);
            color: #0f172a;
        }

        .colon {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.3; }
        }

        @media (max-width: 600px) {
            .clock-container {
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
            }
            .time {
                font-size: 3rem;
            }
            .seconds {
                font-size: 1.8rem;
            }
            .ampm {
                font-size: 1rem;
            }
            .date {
                font-size: 1rem;
            }
            .theme-toggle {
                top: 1rem;
                right: 1rem;
                width: 2.5rem;
                height: 2.5rem;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>

    <div class="clock-container">
        <div class="greeting" id="greeting">Good evening</div>

        <div class="time">
            <span id="hours">00</span>
            <span class="colon">:</span>
            <span id="minutes">00</span>
            <span class="colon">:</span>
            <span class="seconds" id="seconds">00</span>
            <span class="ampm" id="ampm">AM</span>
        </div>

        <div class="date" id="date">Loading date...</div>
    </div>

    <script>
        // ============================================
        // DIGITAL CLOCK — WORKING VERSION
        // ============================================

        // Wait until the HTML is fully loaded
        document.addEventListener('DOMContentLoaded', function () {

            // ---------- 1. Get HTML elements ----------
            const hoursEl    = document.getElementById('hours');
            const minutesEl  = document.getElementById('minutes');
            const secondsEl  = document.getElementById('seconds');
            const ampmEl     = document.getElementById('ampm');
            const dateEl     = document.getElementById('date');
            const greetingEl = document.getElementById('greeting');
            const themeToggle = document.getElementById('themeToggle');

            // ---------- 2. Safety check ----------
            if (!hoursEl || !minutesEl || !secondsEl || !ampmEl || !dateEl) {
                console.error('❌ Missing HTML elements. Check IDs match.');
                return;
            }

            console.log('✅ Clock script loaded');

            // ---------- 3. Helper: add leading zero ----------
            function pad(number) {
                return String(number).padStart(2, '0');
            }

            // ---------- 4. Greeting based on hour ----------
            function getGreeting(hour) {
                if (hour < 12) return '☀️ Good morning';
                if (hour < 17) return '🌤️ Good afternoon';
                if (hour < 21) return '🌆 Good evening';
                return '🌙 Good night';
            }

            // ---------- 5. Update the clock ----------
            function updateClock() {
                const now = new Date();

                // Get time parts
                let hours24   = now.getHours();        // 0 - 23
                const minutes = now.getMinutes();      // 0 - 59
                const seconds = now.getSeconds();      // 0 - 59

                // Convert to 12-hour format
                const ampm = hours24 >= 12 ? 'PM' : 'AM';
                let hours12 = hours24 % 12;
                if (hours12 === 0) hours12 = 12;       // 0 → 12

                // Update the DOM
                hoursEl.textContent   = pad(hours12);
                minutesEl.textContent = pad(minutes);
                secondsEl.textContent = pad(seconds);
                ampmEl.textContent    = ampm;

                // Update greeting
                greetingEl.textContent = getGreeting(hours24);

                // Update date
                const options = {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                };
                dateEl.textContent = now.toLocaleDateString('en-US', options);

                // Log for debugging (check F12 console)
                console.log('Tick →', pad(hours12) + ':' + pad(minutes) + ':' + pad(seconds), ampm);
            }

            // ---------- 6. Theme toggle ----------
            themeToggle.addEventListener('click', function () {
                document.body.classList.toggle('light');
                const isLight = document.body.classList.contains('light');
                themeToggle.textContent = isLight ? '☀️' : '🌙';
                localStorage.setItem('clockTheme', isLight ? 'light' : 'dark');
            });

            // Load saved theme
            const savedTheme = localStorage.getItem('clockTheme');
            if (savedTheme === 'light') {
                document.body.classList.add('light');
                themeToggle.textContent = '☀️';
            }

            // ---------- 7. START THE CLOCK ----------
            updateClock();                      // Run once immediately (no delay)
            setInterval(updateClock, 1000);     // Run every 1 second

            console.log('⏰ Clock is running!');
        });
    </script>
</body>
</html>
